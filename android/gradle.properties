# Project-wide Gradle settings. A machine with less memory can override
# these in ~/.gradle/gradle.properties (this one does, see README.md "Build").

# The Gradle daemon's memory.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Each module's R class has only its own resources.
android.nonTransitiveRClass=true
kotlin.code.style=official

# The server the app talks to (core/network's BuildConfig.SERVER). -Psamfran.server=… overrides it.
samfran.server=https://samfran.rudnam.com

# Firebase's public client settings (not secret) for locked apps' push notifications.
