<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SamFran</title>

<meta name="theme-color" content="#faf8f4">
<meta name="robots" content="noindex">

<body class="landing">
<main class="intro">
  <img class="intro-logo" src="/icon.svg" alt="" width="56" height="56">

  <p class="intro-foot">
    <button type="button" class="link quiet" id="language-toggle" lang="ja" data-ja="English">日本語</button>
