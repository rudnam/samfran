# Deletes a pull request's pre-releases once it's merged or closed, with their
# tags: the Android preview (ci.yml, "Publish the preview APK") and the CI
# screenshots (.github/pr-results.sh).
name: Android preview cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh release delete "android-pr-$PR" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "no preview for this pull request"
          gh release delete "ci-pr-$PR" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "no CI results for this pull request"
